# حدود المخاطر — يطبّقها الكود نفسه، ولا يستطيع أي وكيل ذكاء اصطناعي تجاوزها.
trading_enabled: true        # false = الوكلاء يحللون فقط بدون إرسال أوامر
max_position_value: 2000     # أقصى قيمة لمركز واحد بالدولار
max_total_exposure: 8000     # أقصى مجموع المراكز المفتوحة
max_orders_per_hour: 10
daily_loss_limit: 300        # عند تجاوز هذه الخسارة اليومية يتوقف التداول تلقائياً
min_confidence: 0.6          # أقل ثقة يقبلها لقرار المدير التنفيذي
stop_loss_pct: 1.0           # وقف الخسارة إلزامي لكل صفقة
take_profit_pct: 2.0
allow_short: false
