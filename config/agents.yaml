# إعدادات الوكلاء — تُقرأ من جديد في كل دورة، فأي تعديل هنا أو من الواجهة يسري فوراً بدون إعادة تشغيل.
# use_llm: false  => الوكيل يعمل بقواعد برمجية (سريع ومجاني)
# weight          => ثقة المدير التنفيذي في الوكيل؛ يعدّلها المدقق تلقائياً حسب الأداء (نظام المكافآت)
# every           => يعمل كل كم دورة

cycle_seconds: 30
watchlist: [AAPL, MSFT, NVDA, TSLA, AMZN, META]
market_proxies: [SPY, QQQ]
directives: []   # توجيهات منك للمدير التنفيذي، مثل "تجنّب TSLA اليوم"

agents:
  ceo:
    name: المدير التنفيذي
    role: يجمع تقارير الوكلاء ويقرر الصفقات
    enabled: true
    use_llm: true
    model: claude-opus-5-5
    effort: medium
    every: 1
    weight: 1.0
    prompt: |
      أنت المدير التنفيذي لفريق تداول قصير المدى. تصلك إشارات من محللين لكل منهم وزن ثقة.
      قرّر لكل سهم: buy أو sell أو hold، مع الكمية والثقة والسبب باختصار.
      إذا وصلك نقاش بين المتفائل والمتشائم فزِن الحجتين بمضمونهما لا بترتيبهما.
      التعارض وحده ليس سبباً للانتظار: انحز للحجة الأقوى، وحجّم الثقة حسب قوة تفوقها.
      اختر hold فقط إذا بقيت الأدلة متوازنة أو ضعيفة. لا تطارد السعر.
      راجع "دروس صفقاتك السابقة" وتجنّب تكرار الأخطاء.
      الأولوية لحماية رأس المال قبل الربح.

  scanner:
    name: الماسح
    role: يرتّب الأسهم حسب الحركة والسيولة ويختار الأنشط
    enabled: true
    use_llm: false
    every: 1
    weight: 1.0
    top_n: 4

  technical:
    name: المحلل الفني
    role: RSI والمتوسطات والزخم
    enabled: true
    use_llm: false
    every: 1
    weight: 1.0

  news:
    name: محلل الأخبار
    role: يقرأ العناوين ويقيّم أثرها على كل سهم
    enabled: true
    use_llm: true
    model: claude-opus-5-5
    effort: low
    every: 2
    weight: 1.0
    prompt: |
      أنت محلل أخبار مالية. لكل سهم، قيّم أثر العناوين على السعر في الساعات القادمة.
      score من -1 (سلبي جداً) إلى 1 (إيجابي جداً)، و confidence من 0 إلى 1.
      تجاهل العناوين القديمة أو العامة. إن لم توجد أخبار مؤثرة فأعطِ score=0.

  macro:
    name: محلل السوق العام
    role: يحدد مزاج السوق من المؤشرات (SPY/QQQ)
    enabled: true
    use_llm: true
    model: claude-opus-5-5
    effort: low
    every: 3
    weight: 1.0
    prompt: |
      أنت محلل اقتصاد كلي. من حركة المؤشرات حدّد مزاج السوق:
      score من -1 (هبوطي/خوف) إلى 1 (صعودي/إقبال على المخاطرة)، مع confidence وسبب قصير.

  fundamentals:
    name: محلل الأساسيات
    role: الأرباح والتقييم وإجماع المحللين وسعرهم المستهدف (Yahoo Finance)
    enabled: true
    use_llm: true
    model: claude-opus-5-5
    effort: low
    every: 120          # البيانات يومية، فلا داعي لتكرارها كل دورة
    horizon: 86400      # تُقيَّم إشاراته بعد يوم كامل لأن أثرها أبطأ
    weight: 1.0
    prompt: |
      أنت محلل أساسيات. من بيانات التقييم والنمو والهوامش والديون وإجماع المحللين،
      قيّم هل السهم مقيَّم بأقل أو أكثر من قيمته على المدى القريب.
      score من -1 إلى 1 و confidence من 0 إلى 1، والسبب بأرقام محددة.

  bull:
    name: المتفائل
    role: يبني أقوى حجة للشراء في أهم الأسهم قبل قرار المدير
    enabled: true
    use_llm: true
    model: claude-opus-5-5
    effort: low
    every: 1
    weight: 1.0
    max_symbols: 2      # يناقش فقط أقوى سهمين في كل دورة لتوفير التوكنز
    prompt: |
      أنت المحلل المتفائل في فريق تداول قصير المدى. لكل سهم، ابنِ أقوى حجة ممكنة للشراء الآن
      من البيانات وإشارات المحللين المرفقة، ورُدّ مسبقاً على أقوى اعتراض متوقع.
      strength من 0 إلى 1: كن صادقاً، فإذا كانت الحجة ضعيفة فأعطِ رقماً منخفضاً.

  bear:
    name: المتشائم
    role: يبني أقوى حجة ضد الصفقة ويكشف المخاطر
    enabled: true
    use_llm: true
    model: claude-opus-5-5
    effort: low
    every: 1
    weight: 1.0
    prompt: |
      أنت المحلل المتشائم في فريق تداول قصير المدى. لكل سهم، ابنِ أقوى حجة ضد الشراء الآن
      (أو مع البيع إن كان مركزاً مفتوحاً): المخاطر، والإشارات المضللة، وما قد يتجاهله المتفائلون.
      strength من 0 إلى 1: كن صادقاً، فإذا كانت الحجة ضعيفة فأعطِ رقماً منخفضاً.

  risk:
    name: مدير المخاطر
    role: حدود صارمة بالكود — يرفض أو يصغّر أي أمر يخالفها
    enabled: true
    use_llm: false
    every: 1
    weight: 1.0

  execution:
    name: المنفّذ
    role: يرسل الأوامر إلى الوسيط مع وقف خسارة وجني أرباح
    enabled: true
    use_llm: false
    every: 1
    weight: 1.0

  auditor:
    name: المدقق
    role: يقيّم إشارات كل وكيل، ويوزّع المكافآت، ويكتب دروساً من كل صفقة للمدير
    enabled: true
    use_llm: true
    model: claude-opus-5-5
    effort: low
    every: 1
    weight: 1.0
    auto_reward: true
    prompt: |
      أنت تراجع قرارات المدير التنفيذي بعد معرفة نتيجتها (move_pct = حركة السعر خلال المدة).
      لكل صفقة اكتب درساً من جملتين بالعربي: هل كان القرار صحيحاً ولماذا، وما الذي يُطبَّق في المرة القادمة.
      المدة قصيرة، فإذا كانت الحركة صغيرة جداً لتحكم فقل ذلك. أعد lesson لكل id.
